---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: core-reloader
  namespace: argocd
  labels:
    app.kubernetes.io/name: reloader
    app.kubernetes.io/part-of: vixens-core
    vixens.lab/environment: dev
spec:
  project: default
  source:
    repoURL: https://github.com/charchess/vixens-core.git
    targetRevision: main
    path: apps/00-infra/reloader/overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: tools
