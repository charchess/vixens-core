---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fabric-root
  namespace: argocd
  labels:
    vixens.io/domain: core
    vixens.io/component: domain-root
  annotations:
    argocd.argoproj.io/sync-wave: "20"
spec:
  project: default
  source:
    repoURL: https://github.com/charchess/vixens-fabric.git
    targetRevision: main
    path: argocd/overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
