---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: core-traefik-middlewares
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://github.com/charchess/vixens-core.git
    targetRevision: main
    path: apps/00-infra/traefik/base
  destination:
    server: https://kubernetes.default.svc
    namespace: traefik
