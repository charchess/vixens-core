---
# Development External Secrets Operator.
# The ArgoCD Application resource name keeps the historical `-umi` suffix
# temporarily to avoid a delete/recreate migration during repository cleanup.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: core-external-secrets-umi
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-4"
  labels:
    app.kubernetes.io/part-of: vixens
    app.kubernetes.io/component: secrets-management
spec:
  project: default
  sources:
    - repoURL: https://charts.external-secrets.io
      chart: external-secrets
      targetRevision: 2.10.0
      helm:
        releaseName: external-secrets
        valueFiles:
          - $values/apps/00-infra/external-secrets/values/dev.yaml
    - repoURL: https://github.com/charchess/vixens-core.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    syncOptions:
      # ESO CRDs exceed Kubernetes' client-side apply annotation limit.
      - ServerSideApply=true
