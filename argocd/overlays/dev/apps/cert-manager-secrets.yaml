---
# cert-manager-secrets - dev environment
# Manages External Secrets / OpenBao integration for cert-manager secrets
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: core-cert-manager-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0" # Deploy before webhook (wave 1)
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  source:
    repoURL: https://github.com/charchess/vixens-core.git
    targetRevision: main
    path: apps/00-infra/cert-manager-webhook-gandi/overlays/dev
