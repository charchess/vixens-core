---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: core-shared-namespaces
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  project: default
  source:
    repoURL: https://github.com/charchess/vixens-core.git
    targetRevision: main
    path: apps/_shared/namespaces
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
