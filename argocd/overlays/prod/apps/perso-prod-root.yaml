---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: perso-prod-root
  namespace: argocd
  labels:
    vixens.io/domain: core
    vixens.io/component: domain-root
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  project: default
  source:
    repoURL: https://github.com/charchess/vixens-perso.git
    targetRevision: prod-stable
    path: argocd/overlays/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
