kind: Application
metadata:
  name: infra-prod-root
  namespace: argocd
  labels:
    vixens.io/domain: core
    vixens.io/component: domain-root
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  project: default
  source:
    repoURL: https://github.com/charchess/vixens-infra.git
    targetRevision: 0dc7cda501f8f36b18d080b83e1efb78dc2fc866
    path: argocd/overlays/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
