---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: infra-prod-root
  namespace: argocd
  labels:
    vixens.io/domain: core
    vixens.io/component: domain-root
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  project: default
  source:
    repoURL: https://github.com/charchess/vixens-infra.git
    targetRevision: ea51e7fa9a99c6f69b295e4b5443e6f8b1705a88
    path: argocd/overlays/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
