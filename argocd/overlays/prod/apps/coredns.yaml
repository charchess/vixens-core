---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: core-coredns
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    # CoreDNS forwards public DNS to canonical TrueNAS AdGuard.
    # Apply only after the resolver has been verified healthy.
    argocd.argoproj.io/sync-wave: "6"
spec:
  project: default
  source:
    repoURL: https://github.com/charchess/vixens-core.git
    targetRevision: prod-stable
    path: apps/00-infra/coredns/overlays/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
