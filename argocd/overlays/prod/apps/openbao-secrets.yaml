---
# Production OpenBao/External Secrets store wiring. OpenBao is hosted on TrueNAS,
# and this overlay contains no dependency on the UMI workstation.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: core-openbao-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
  labels:
    app.kubernetes.io/part-of: vixens
    app.kubernetes.io/component: secrets-management
spec:
  project: default
  source:
    repoURL: https://github.com/charchess/vixens-core.git
    targetRevision: prod-stable
    path: apps/00-infra/openbao/overlays/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
