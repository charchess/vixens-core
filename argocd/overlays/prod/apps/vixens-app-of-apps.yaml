---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vixens-app-of-apps
  namespace: argocd
  labels:
    vixens.lab/environment: prod
    vixens.lab/managed-by: gitops
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/charchess/vixens-core.git
    targetRevision: prod-stable
    path: argocd/overlays/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  ignoreDifferences:
    - group: argoproj.io
      kind: Application
      jsonPointers:
        - /metadata/finalizers
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
