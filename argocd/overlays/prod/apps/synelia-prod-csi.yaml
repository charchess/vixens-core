---
# Official TrueNAS CSI production Application. Existing PVs retain their
# immutable CSI identities; this driver does not adopt foreign volumes.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: core-synelia-prod-csi
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  labels:
    vixens.io/domain: core
spec:
  project: default
  sources:
    - repoURL: https://raw.githubusercontent.com/truenas/truenas-csi/master/charts
      chart: truenas-csi
      targetRevision: 1.4.0
      helm:
        releaseName: synelia-prod-csi
        valueFiles:
          - $values/apps/01-storage/synelia-csi/prod/values.yaml
    - repoURL: https://github.com/charchess/vixens-core.git
      targetRevision: prod-stable
      ref: values
    - repoURL: https://github.com/charchess/vixens-core.git
      targetRevision: prod-stable
      path: apps/01-storage/synelia-csi/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: synelia-prod-csi
  # Kyverno omits the upstream chart's strict Directory assertion only for the
  # named iscsi-dir volume; Talos cannot reliably satisfy that hostPath check.
  ignoreDifferences:
    - group: apps
      kind: DaemonSet
      namespace: synelia-prod-csi
      name: synelia-prod-csi-node
      jqPathExpressions:
        - .spec.template.spec.volumes[] | select(.name == "iscsi-dir").hostPath.type
  syncPolicy:
    syncOptions:
      - RespectIgnoreDifferences=true
