---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
patches:
  # Dev uses the dedicated out-of-band bootstrap identity, independent of prod.
  # Terraform creates external-secrets/openbao-token before this Store is activated.
  # Never place token bytes in Git or reuse the prod/Infra administrative token.
  - target:
      kind: ClusterSecretStore
      name: openbao
    patch: |-
      - op: replace
        path: /spec/provider/vault/auth/tokenSecretRef/name
        value: openbao-token
