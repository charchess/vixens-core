---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: openbao
spec:
  provider:
    vault:
      server: https://openbao.truxonline.com
      path: kv
      version: v2
      caProvider:
        type: ConfigMap
        name: openbao-infra-ca
        key: ca.crt
      auth:
        tokenSecretRef:
          namespace: external-secrets
          name: openbao-token
          key: token
