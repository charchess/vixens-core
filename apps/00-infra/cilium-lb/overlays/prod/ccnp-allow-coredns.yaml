---
# Allow CoreDNS only for non-ESO endpoints. ESO's DNS is constrained by its
# dedicated L7 policy to the approved OpenBao resolver names below.
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: allow-coredns-egress
spec:
  endpointSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: NotIn
        values:
          - external-secrets
      - key: io.kubernetes.pod.namespace
        operator: NotIn
        values:
          - external-secrets
  enableDefaultDeny:
    ingress: true
    egress: true
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
