---
# ESO has two distinct OpenBao paths: private Fabric TCP/8200 and public Infra
# HTTPS/443. Its DNS egress is constrained at L7 to the approved resolver names.
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: allow-external-secrets-openbao
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: external-secrets
      io.kubernetes.pod.namespace: external-secrets
  egress:
    # Private Fabric OpenBao remains a distinct in-cluster TCP/8200 hop.
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: txo-fabric-system
            k8s:app.kubernetes.io/name: openbao-fabric
            k8s:app.kubernetes.io/component: secret-plane
      toPorts:
        - ports:
            - port: "8200"
              protocol: TCP
    # Shared Infra OpenBao is reached only through its reviewed TLS hostname.
    - toFQDNs:
        - matchName: openbao.truxonline.com
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    # DNS is permitted only to CoreDNS and only for the approved resolver names.
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchName: openbao.truxonline.com.external-secrets.svc.cluster.local
              - matchName: openbao.truxonline.com.svc.cluster.local
              - matchName: openbao.truxonline.com.cluster.local
              - matchName: openbao.truxonline.com
              - matchName: openbao-fabric.txo-fabric-system.svc.external-secrets.svc.cluster.local
              - matchName: openbao-fabric.txo-fabric-system.svc.svc.cluster.local
              - matchName: openbao-fabric.txo-fabric-system.svc.cluster.local
