---
# OpenBao is hosted on the TrueNAS storage interface. ESO is the sole
# cluster-wide secret reconciler; keep this egress narrowly pinned to the
# verified current endpoint and TCP/8200.
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: allow-external-secrets-openbao
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: external-secrets
      io.kubernetes.pod.namespace: external-secrets
  egress:
    # Private Fabric OpenBao remains a distinct in-cluster TCP/8200 hop.
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: txo-fabric-system
            k8s:app.kubernetes.io/name: openbao-fabric
            k8s:app.kubernetes.io/component: secret-plane
      toPorts:
        - ports:
            - port: "8200"
              protocol: TCP
    # Shared Infra OpenBao is reached only through its reviewed TLS hostname.
    - toFQDNs:
        - matchName: openbao.truxonline.com
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    # FQDN resolution requires only the in-cluster DNS service.
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
