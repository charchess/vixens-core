---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMStaticScrape
metadata:
  name: truenas-ops
  namespace: monitoring
spec:
  jobName: truenas-ops
  targetEndpoints:
    - targets:
        - 192.168.111.69:9766
      scheme: http
      path: /metrics
      interval: 60s
      scrapeTimeout: 15s
      labels:
        appliance: synelia
        role: storage
